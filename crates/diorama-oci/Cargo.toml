[package]
name = "diorama-oci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
diorama-cri = { version = "=0.1.0", path = "../diorama-cri" }
diorama-supervisor = { version = "=0.1.0", path = "../diorama-supervisor" }
oci-cri = { version = "=0.1.15", path = "../../../oci-lib/crates/oci-cri", default-features = false }
tokio = { version = "=1.54.1", features = ["macros", "sync", "time"] }

[dev-dependencies]
dioramalet = { version = "=0.1.0", path = "../diorama-kubelet" }
oci-cri = { version = "=0.1.15", path = "../../../oci-lib/crates/oci-cri", default-features = false, features = ["test-support"] }
tempfile = "=3.27.0"

[lints]
workspace = true
