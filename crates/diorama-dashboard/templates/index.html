<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diorama Node Dashboard</title>
  <script src="/htmx.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; background: #0d1117; color: #e6edf3; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #30363d; padding-bottom: 0.75rem; margin-bottom: 1.25rem; }
    h1 { font-size: 1.2rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .badge { font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 99px; background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb66; }
    .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .gauge-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.35rem; }
    meter { width: 100%; height: 1.25rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.45rem 0.5rem; border-top: 1px solid #21262d; }
    th { color: #8b949e; border-top: none; }
    .phase { padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.75rem; }
    .phase-running { background: #23863633; color: #3fb950; }
    .phase-pending { background: #9e6a0333; color: #d29922; }
    .phase-succeeded { background: #1f6feb33; color: #58a6ff; }
    .phase-failed { background: #da363333; color: #f85149; }
  </style>
</head>
<body>
  <header>
    <h1>Diorama Realtime Node Dashboard</h1>
    <small>HTTP/3 (QUIC) + SSE / HTMX</small>
  </header>

  <main hx-sse="connect:/events">
    <div hx-sse="swap:node" hx-get="/node" hx-trigger="every 2s">
      {{NODE_HTML}}
    </div>
    <div hx-sse="swap:pods" hx-get="/pods" hx-trigger="every 2s">
      {{PODS_HTML}}
    </div>
  </main>
</body>
</html>
